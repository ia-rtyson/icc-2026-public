services:
  ignition:
    # The public Ignition 2027.2.0-beta2 release, which ships the Catalyst (AI)
    # modules. Pinned on purpose: a 2027 data volume cannot be downgraded, so
    # change the tag here deliberately rather than through an env variable.
    image: inductiveautomation/ignition:2027.2.0-beta2
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-ignition
    restart: unless-stopped
    ports:
      - ${GATEWAY_PORT:-8088}:8088
      - ${GATEWAY_PORT_SSL:-443}:443
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./ignition/config:/usr/local/bin/ignition/data/config
      - ./ignition/projects:/usr/local/bin/ignition/data/projects
      # Reference documents served by the 'reference' WebDev mounted-folder
      # resource at /system/webdev/icc-2026/exchange/tag-import/reference/<file>. Bind-mounted from
      # the repo so the files stay version-controlled; they are generated by
      # scripts/generate_line1_export.py, never hand-edited.
      - ./reference/line1:/reference/line1:ro
    # Written by scripts/youtrack-snapshot.sh alongside the YouTrack seed, and
    # tracked with it, so restoring the tracker and handing the gateway the
    # matching credential are the same step. `required: false` so a checkout
    # that has never had a seed baked still comes up -- the purge job then sits
    # at `no_token`, which is inert rather than broken.
    # Order matters: a later env_file wins, so the seed's token is the default
    # and a YOUTRACK_TOKEN in .env overrides it -- which is what an instance
    # provisioned by hand rather than restored from the seed needs. Loading
    # .env here also puts its other keys in the container environment; they are
    # unused there and harmless. Both are `required: false` so a checkout with
    # neither still comes up.
    env_file:
      - path: ./services/youtrack/seed/token.env
        required: false
      - path: ./.env
        required: false
    # The AI module connects the `youtrack` MCP server once, at startup, and
    # never retries. The gateway reaches RUNNING in ~40 s and YouTrack takes
    # longer, so without this the connection fails with a 405 on every cold
    # start and stays dead until a config rescan.
    # Only `docker compose up` honours this. A Docker daemon restart (host
    # reboot) brings `restart: unless-stopped` containers back with no ordering,
    # so after a reboot, rescan config.
    depends_on:
      youtrack:
        condition: service_healthy
    environment:
      ACCEPT_IGNITION_EULA: 'Y'
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      TZ: America/Denver
      IGNITION_LICENSE_KEY: ${IGNITION_LICENSE_KEY:-}
      IGNITION_ACTIVATION_TOKEN: ${IGNITION_ACTIVATION_TOKEN:-}
      # Read by exchange.issueReport.report.youtrackUrl() so the Report Issue page's YouTrack
      # button points at the right place. The host comes from the browser's own
      # session (session.props.gateway.address); only the port is configured
      # here, and it tracks the published port above. Set YOUTRACK_URL instead
      # to override the whole base URL (reverse proxy, or a separate host).
      YOUTRACK_PORT: ${YOUTRACK_PORT:-8089}
      YOUTRACK_URL: ${YOUTRACK_URL:-}
      # Read by exchange.issueReport.pipeline.purgeTickets() -- the nightly demo reset deletes
      # every ticket in the UI project via the YouTrack REST API, which has no
      # MCP tool and needs a token of its own. Container-to-container, so the
      # internal URL, not the published one. **No token = no purge**: the job
      # logs once and does nothing, so an environment that has not set this is
      # inert rather than broken.
      #
      # YOUTRACK_TOKEN is deliberately NOT set here -- it comes from the
      # env_file above. An `environment:` entry wins over an env_file, so
      # `${YOUTRACK_TOKEN:-}` would pin it empty on exactly the fresh stack
      # this is meant to serve. Set it in that file, not here.
      YOUTRACK_INTERNAL_URL: ${YOUTRACK_INTERNAL_URL:-http://youtrack:8080}
      # Read by exchange.demo.hosts.mailboxUrl() so the Alarm Flood Event page's
      # "Alarm Notification Agent" button opens the Gmail look-alike inbox on
      # the host the browser actually used -- same arrangement as YouTrack
      # above, and GMAIL_PORT tracks the published port on the gmail service
      # below so the two cannot drift. Set GMAIL_URL to override the whole
      # base URL (reverse proxy, or a separate host).
      GMAIL_PORT: ${GMAIL_PORT:-8090}
      GMAIL_URL: ${GMAIL_URL:-}
    command:
      - "-n"
      - "${COMPOSE_PROJECT_NAME:-icc-2026}-ignition"
    networks:
      - net

  # Postgres Database
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-postgres
    image: postgres:15.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: postgres
      TZ: America/Denver
    ports:
     - ${POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only fires on a brand-new postgres-data volume. postgres-init below is
      # what keeps an EXISTING volume up to date; this mount just means a fresh
      # stack has its schema before anything can connect.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 makes this a TCP check. On a brand-new volume the image runs
      # initdb.d against a temporary server that listens on the unix socket only,
      # so a socket check reports healthy before the real server is up and
      # postgres-init (which connects over TCP) fails with "Connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - net

  # Applies sql/*.sql on EVERY `docker compose up`, not just on first volume
  # init. The official Postgres image runs /docker-entrypoint-initdb.d exactly
  # once -- when the data directory is empty -- so on any stack that already has
  # a postgres-data volume a newly added migration never runs, and the demo
  # fails at runtime with something unhelpful like "column output_targets does
  # not exist". This one-shot service closes that gap.
  #
  # Every file in sql/ is written to be safe to replay: CREATE TABLE/INDEX IF
  # NOT EXISTS, ADD COLUMN IF NOT EXISTS, and seed blocks guarded by
  # `WHERE NOT EXISTS (SELECT 1 FROM <table>)` so live demo data is never
  # clobbered. Keep it that way when adding a file here -- this runs
  # unattended against a database with real state in it.
  #
  # ON_ERROR_STOP=1 plus `-1` (single transaction) means a bad migration fails
  # loudly and atomically instead of leaving the schema half-applied. The
  # service exits 0 and stays exited; `docker compose ps` will show it as
  # Exited(0), which is success, not a crash.
  postgres-init:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-postgres-init
    image: postgres:15.4
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
      TZ: America/Denver
    volumes:
      - ./sql:/sql:ro
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        for f in /sql/*.sql; do
          echo "==> applying $${f##*/}"
          psql -v ON_ERROR_STOP=1 -1 -h postgres -U admin -d postgres -f "$$f"
        done
        echo "==> all migrations applied"
    networks:
      - net

  # YouTrack — issue tracker + the state machine for the Report -> Build -> Execute
  # pipeline. 2025.3 is the first release with the built-in MCP server (at /mcp),
  # which is how the gateway's AI agents talk to it.
  #
  # On the shared `net` bridge both directions resolve by container name:
  #   gateway  -> YouTrack : http://youtrack:8080
  #   YouTrack -> gateway  : http://${COMPOSE_PROJECT_NAME:-icc-2026}-ignition:8088
  # so the column-change webhook needs no tunnel.
  #
  # --------------------------------------------------------------------------
  # Restores services/youtrack/seed/ into the volumes when they are empty, so a
  # brand-new environment gets a tracker that is already provisioned -- UI
  # project, Stage field, board columns -- and, the part that actually matters,
  # already holds the permanent token the gateway's MCP connection config is
  # encrypted with. Minting a fresh token on first boot instead would mean
  # pushing it back into the gateway, which needs a gateway API credential,
  # which is one more thing to configure; shipping the provisioned instance
  # avoids the whole loop.
  #
  # Must complete before youtrack starts: YouTrack writes an empty database on
  # first start, and the restore would then correctly decline, leaving a blank
  # tracker sitting on the setup wizard. Refresh the seed with
  # scripts/youtrack-snapshot.sh.
  youtrack-init:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-youtrack-init
    image: alpine:3
    restart: "no"
    volumes:
      - youtrack-data:/restore/data
      - youtrack-conf:/restore/conf
      - ./services/youtrack/seed:/seed:ro
      - ./services/youtrack/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/restore.sh"]
    networks:
      - net

  youtrack:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-youtrack
    image: jetbrains/youtrack:${YOUTRACK_VERSION:-2025.3.131383}
    restart: unless-stopped
    depends_on:
      youtrack-init:
        condition: service_completed_successfully
    ports:
      - ${YOUTRACK_PORT:-8089}:8080
    environment:
      TZ: America/Denver
    volumes:
      - youtrack-data:/opt/youtrack/data
      - youtrack-conf:/opt/youtrack/conf
      - youtrack-logs:/opt/youtrack/logs
      - youtrack-backups:/opt/youtrack/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      # Probe every 5 s during start_period, so the gateway (which waits on
      # this) starts as soon as YouTrack answers, not at the next 30 s tick.
      start_interval: 5s
    networks:
      - net

  # http://localhost:5050/browser/
  pgadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
       - pgadmin-data:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT:-5051}:80
    networks:
      - net

  # --- Demo mail ------------------------------------------------------------
  #
  # Mailpit is the SMTP sink the gateway's Email Profile points at, so alarm
  # notification pipelines can "send" mail on stage with nothing leaving the
  # box. `gmail` is a static nginx front end that renders whatever landed in
  # Mailpit as a familiar-looking inbox -- it reads Mailpit's HTTP API from the
  # browser, so GMAIL_* below is cosmetic (the account name shown in the UI).
  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-mailpit
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      TZ: America/Denver
      MP_UI_BIND_ADDR: 0.0.0.0:80
      # Retention. MP_MAX_AGE only accepts (h)ours or (d)ays -- minutes are not a
      # unit, so 1h is the floor; sub-hour expiry would need an external sweeper
      # against the /api/v1/messages endpoint.
      MP_MAX_AGE: 1h
    ports:
      - ${MAILPIT_UI_PORT:-8025}:80      # Mailpit's own web UI
      - ${MAILPIT_SMTP_PORT:-1025}:1025  # SMTP -- the gateway Email Profile target
    networks:
      - net

  # Disabled 2026-09-17 -- was injecting scenery mail into the inbox
  # unconditionally, which is no longer wanted. Left commented (not deleted)
  # so the design and services/mailpit/seed_demo_mail.py stay documented and
  # this is a one-line re-enable if scenery mail is wanted again later.
  #
  # Keeps scenery in the inbox with no intervention. Mailpit expires mail at
  # MP_MAX_AGE (1h, which is what stops a day of demo runs piling up fifty
  # notifications) and that takes the seeded messages with it -- so this loops
  # rather than running once. It re-seeds only when every seeded subject has
  # aged out, never to top the inbox up, because injecting four emails while
  # someone is presenting would shove the agent's notification down the list
  # mid-sentence.
  # mailpit-seed:
  #   container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-mailpit-seed
  #   image: python:3.12-alpine
  #   restart: unless-stopped
  #   depends_on:
  #     - mailpit
  #   environment:
  #     TZ: America/Denver
  #     MAILPIT_URL: http://mailpit
  #     # Must match the gmail service below -- that UI matches this address to
  #     # decide which messages are "to me".
  #     GMAIL_ACCOUNT: ${GMAIL_ACCOUNT:-iggy@example.com}
  #     SEED_INTERVAL_SECS: ${MAIL_SEED_INTERVAL_SECS:-600}
  #   volumes:
  #     - ./services/mailpit/seed_demo_mail.py:/seed_demo_mail.py:ro
  #   command: ["python3", "/seed_demo_mail.py"]
  #   networks:
  #     - net

  gmail:
    container_name: ${COMPOSE_PROJECT_NAME:-icc-2026}-gmail
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - mailpit
    environment:
      TZ: America/Denver
      GMAIL_ACCOUNT: ${GMAIL_ACCOUNT:-demo@example.com}
      GMAIL_NAME: ${GMAIL_NAME:-Demo User}
    volumes:
      - ./services/mailpit/gmail/html:/usr/share/nginx/html
      - ./services/mailpit/gmail/templates:/etc/nginx/templates
    ports:
      - ${GMAIL_PORT:-8090}:80
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  ignition-data:
  postgres-data:
  pgadmin-data:
  youtrack-data:
  youtrack-conf:
  youtrack-logs:
  youtrack-backups:
